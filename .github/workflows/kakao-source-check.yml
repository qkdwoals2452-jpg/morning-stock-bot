name: Kakao Drive intake checks
on:
  pull_request:
    paths:
      - kakao_news_source.py
      - kakao_drive_bridge.py
      - test_kakao*.py
      - news_engine.py
      - breaking_news.py
      - .github/workflows/kakao-source-check.yml
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pandas lxml beautifulsoup4
      - run: python -m unittest test_kakao_news_source test_kakao_drive_bridge test_primary_news test_feeder_news test_breaking_news test_breaking_quality
