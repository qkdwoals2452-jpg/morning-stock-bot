name: ORION Breaking News Check
on:
  pull_request:
    paths: [breaking_news.py, main.py, news_engine.py, test_breaking_news.py, test_event_analysis_route.py, .github/workflows/breaking-news.yml, .github/workflows/breaking-news-check.yml]
permissions:
  contents: read
jobs:
  breaking-news-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pandas lxml beautifulsoup4
      - run: python -m unittest discover -v
