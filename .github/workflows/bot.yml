name: Morning Stock Bot

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt

      # 첫 실행은 새로 받고 같은 KST 주의 후속 실행만 검증된 CSV를 재사용한다.
      # 이전 주 캐시는 복원하지 않아 신규 상장사 코드 갱신을 무기한 미루지 않는다.
      - name: DART 주간 캐시 키
        id: corp-cache-key
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          year, week, _ = datetime.now(ZoneInfo('Asia/Seoul')).isocalendar()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'week={year}-{week:02d}\n')
          PY

      - name: DART 기업코드 캐시 복원
        id: corp-cache
        uses: actions/cache/restore@v4
        with:
          path: corp_code.csv
          key: orion-corp-code-v1-${{ runner.os }}-${{ steps.corp-cache-key.outputs.week }}

      - name: DART 기업코드 검증 및 준비
        run: |
          python - <<'PY'
          from build_corp_db import ensure_corp_db
          ensure_corp_db()
          PY

      - name: 검증된 DART 기업코드 캐시 저장
        if: steps.corp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: corp_code.csv
          key: orion-corp-code-v1-${{ runner.os }}-${{ steps.corp-cache-key.outputs.week }}

      - name: 봇 실행
        run: python main.py

      # 다음 예약 실행에서도 추천/가격 이력을 이어서 사용한다.
      - name: 백테스트 및 표시용 이력 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for history_file in orion_backtest.json data/history.json; do
            if [ -f "$history_file" ]; then
              git add -- "$history_file"
            fi
          done
          if git diff --cached --quiet; then
            echo "추적 이력 변경 없음"
            exit 0
          fi
          git commit -m "chore: persist ORION tracking history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

