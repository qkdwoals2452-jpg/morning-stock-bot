name: ORION Event Test

on:
  workflow_dispatch:

jobs:
  event-test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 이벤트 엔진 테스트
        run: python orion_event_test.py
