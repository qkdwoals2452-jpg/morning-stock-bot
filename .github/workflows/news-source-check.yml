name: ORION News Source Check

on:
  push:
    branches: [orion-news-source-fix]
  pull_request:
    paths: [news_engine.py, event_identity_engine.py, test_news_sources.py, test_major_media.py, .github/workflows/news-source-check.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pandas
      - name: Feed failure handling and existing ORION regressions
        run: python -m unittest -v test_news_sources test_major_media test_news_roles test_orion_backtest test_financial_data test_event_analysis_route test_dart_startup test_orion_event_subject
      - name: Live Nasdaq RSS and SEC Atom diagnostics
        run: |
          python - <<'PY'
          from news_engine import get_nasdaq_news, parse_atom
          diagnostics = {}
          nasdaq_articles = get_nasdaq_news(diagnostics)
          from news_engine import filter_recent_news
          recent_nasdaq = filter_recent_news(nasdaq_articles, hours=36)
          print("NASDAQ_RECOVERY:", {"parsed": len(nasdaq_articles), "recent": len(recent_nasdaq), "sample": [{"title": a["title"], "published_at": a["published_at"], "source": a["source"]} for a in recent_nasdaq[:12]]})
          assert recent_nasdaq, "Nasdaq recovery unverified: no recent publisher-validated articles"
          parse_atom('https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&output=atom', 'US', 'SEC_Filings', diagnostics)
          # 응답에 최근 핵심 기사가 없어도 정상 수집이다. 접근 오류는 실패로 표시한다.
          nasdaq_source = diagnostics['Nasdaq_Tech'].get('fallback_source', 'Nasdaq_Tech')
          for source in (nasdaq_source, 'SEC_Filings'):
              assert diagnostics[source]['status'] != 'error', (source, diagnostics[source])
          print('LIVE FEED PASS:', diagnostics)
          PY
