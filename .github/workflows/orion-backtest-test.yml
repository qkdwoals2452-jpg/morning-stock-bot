name: ORION Backtest Tests
on:
  push:
    branches:
      - orion-event-fixes-review
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run isolated backtest tests
        run: python -m unittest -v test_orion_backtest
